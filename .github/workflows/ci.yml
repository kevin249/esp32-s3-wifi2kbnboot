name: 构建与测试
on: [push, pull_request, workflow_dispatch]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y mtools dosfstools
      - run: python -m unittest discover -s tests -v
      - run: gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Ifirmware/main tests/test_cache.c firmware/main/block_cache.c -o /tmp/test-cache && /tmp/test-cache
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: 编译 ESP32-S3 固件
        shell: bash
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: esp32s3-示例固件
          path: |
            firmware/build/wifi2kbnboot.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
